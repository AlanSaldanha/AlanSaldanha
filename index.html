<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google 1.0</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: Arial, Helvetica, sans-serif;
        color: #202124;
        background: #fff;
      }

      header,
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 24px;
        font-size: 14px;
      }

      .nav-links,
      .footer-links {
        display: flex;
        gap: 18px;
      }

      a {
        color: #202124;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      main {
        flex: 1;
        display: grid;
        place-content: center;
        gap: 26px;
        padding: 0 16px;
      }

      .logo {
        text-align: center;
        font-size: clamp(44px, 8vw, 84px);
        font-weight: 700;
        letter-spacing: -2px;
      }

      .logo span:nth-child(1) {
        color: #4285f4;
      }

      .logo span:nth-child(2) {
        color: #ea4335;
      }

      .logo span:nth-child(3) {
        color: #fbbc05;
      }

      .logo span:nth-child(4) {
        color: #4285f4;
      }

      .logo span:nth-child(5) {
        color: #34a853;
      }

      .logo span:nth-child(6) {
        color: #ea4335;
      }

      form {
        width: min(90vw, 560px);
      }

      .search-input {
        width: 100%;
        padding: 14px 18px;
        border: 1px solid #dfe1e5;
        border-radius: 999px;
        font-size: 16px;
        outline: none;
      }

      .search-input:focus {
        border-color: #c8c9cc;
        box-shadow: 0 1px 6px rgba(32, 33, 36, 0.2);
      }

      .buttons {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 24px;
      }

      button {
        border: 1px solid #f8f9fa;
        border-radius: 4px;
        background: #f8f9fa;
        color: #3c4043;
        font-size: 14px;
        padding: 10px 16px;
        cursor: pointer;
      }

      button:hover {
        border-color: #dadce0;
      }

      footer {
        background: #f2f2f2;
        color: #70757a;
      }

      footer a {
        color: #70757a;
      }
    </style>
  </head>
  <body>
    <header>
      <nav class="nav-links">
        <a href="#">About</a>
        <a href="#">Store</a>
      </nav>
      <nav class="nav-links">
        <a href="#">Gmail</a>
        <a href="#">Images</a>
      </nav>
    </header>

    <main>
      <div class="logo" aria-label="Google logo">
        <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
      </div>

      <form>
        <input class="search-input" type="search" placeholder="Search Google or type a URL" aria-label="Search" />
        <div class="buttons">
          <button type="button">Google Search</button>
          <button type="button">I'm Feeling Lucky</button>
        </div>
      </form>
    </main>

    <footer>
      <div class="footer-links">
        <a href="#">Advertising</a>
        <a href="#">Business</a>
      </div>
      <div class="footer-links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Settings</a>
      </div>
    </footer>
  </body>
</html>
